spring.application.name=assistente-orcamento

# Chave da OpenAI: vem de uma variavel de ambiente, NUNCA escreva a chave aqui
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Modelo de conversa (usa as tools)
spring.ai.openai.chat.options.model=gpt-4o-mini

# Audio -> texto
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt

# Texto -> audio
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.speech.options.voice=alloy

# Banco H2 em arquivo (os dados continuam depois de reiniciar)
spring.datasource.url=jdbc:h2:file:./data/orcamento
spring.jpa.hibernate.ddl-auto=update

# Tamanho maximo do audio enviado
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
